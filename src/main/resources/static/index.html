
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Claude Learning Platform</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f7f8fa;
            color: #202124;
        }

        .app {
            max-width: 850px;
            height: 100dvh;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
            border-inline: 1px solid #eee;
        }

        header {
            padding: 18px 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h2 {
            font-size: 18px;
            margin: 0;
        }

        .new-chat {
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            padding: 9px 12px;
            cursor: pointer;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            padding: 14px 18px;
            border-radius: 14px;
            max-width: 85%;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #e8f0fe;
            align-self: flex-end;
        }

        .assistant {
            background: #f1f3f5;
            align-self: flex-start;
        }

        .error {
            background: #fee2e2;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #e5e7eb;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font: inherit;
        }

        #send {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            cursor: pointer;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
<div class="app">

    <header>
        <h2>🤖 Claude Learning Platform</h2>
        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>
    </header>

    <main id="messages">
        <div class="message assistant">
            Hello! I'm your local AI assistant.
            Ask me anything about software architecture.
        </div>
    </main>

    <form class="input-area" id="chatForm">
        <textarea id="prompt"
                  placeholder="Ask a question..."
                  required></textarea>
        <button id="send" type="submit">Send</button>
    </form>

</div>

<script>
    let conversationId = crypto.randomUUID();
    let busy = false;

    const messages = document.getElementById("messages");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const form = document.getElementById("chatForm");

    function addMessage(text, role) {
        const element = document.createElement("div");
        element.className = "message " + role;

        // textContent prevents HTML injection.
        element.textContent = text;

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
        return element;
    }

    async function sendMessage(event) {
        event.preventDefault();

        if (busy) return;

        const prompt = promptInput.value.trim();
        if (!prompt) return;

        busy = true;
        sendButton.disabled = true;
        promptInput.value = "";

        addMessage(prompt, "user");
        const pending = addMessage("Thinking...", "assistant");

        try {
            const response = await fetch("/api/ai/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    conversationId: conversationId,
                    prompt: prompt
                })
            });

            if (!response.ok) {
                throw new Error(
                    "Server returned HTTP " + response.status
                );
            }

            const data = await response.json();
            pending.textContent = data.answer ?? "Empty response";

        } catch (error) {
            pending.className = "message error";
            pending.textContent = "Error: " + error.message;
        } finally {
            busy = false;
            sendButton.disabled = false;
            promptInput.focus();
            messages.scrollTop = messages.scrollHeight;
        }
    }

    function newChat() {
        if (busy) return;

        conversationId = crypto.randomUUID();
        messages.replaceChildren();
        addMessage("New conversation started.", "assistant");
        promptInput.focus();
    }

    form.addEventListener("submit", sendMessage);

    promptInput.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });
</script>
</body>
</html>
